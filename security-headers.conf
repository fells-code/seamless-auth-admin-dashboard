# Shared security headers.
#
# nginx drops every inherited add_header directive as soon as a location
# declares one of its own, so any location that sets a header (for caching, for
# example) silently loses these. Including this file in each such location keeps
# the set in one place instead of repeating it and letting the copies drift.
#
# connect-src is intentionally scheme-broad because the API origin is configured
# per deployment at runtime (see entrypoint.sh).
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https: http:" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
