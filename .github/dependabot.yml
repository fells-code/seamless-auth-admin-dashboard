version: 2

updates:
  # Base images are pinned by digest, so this is what keeps them patched.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    # The Node major the images build on matches .nvmrc. A major bump that
    # arrives as an image-only change would move the build off that version
    # without the rest of the repo, so those are raised deliberately instead.
    # Digest and minor updates still come through.
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
    groups:
      docker-images:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    # Group routine bumps so review stays manageable. Major updates still open
    # individually because they are the ones that need a real look.
    groups:
      # Vitest and its coverage provider must stay on the same version, so
      # they move together, majors included.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
