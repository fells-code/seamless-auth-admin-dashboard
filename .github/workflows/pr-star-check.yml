name: PR Star Check

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  star-nudge:
    runs-on: ubuntu-latest
    # This is a nudge, not a gate. Even an unexpected failure (the starred list
    # is read from the unauthenticated API, which is rate limited per runner IP)
    # must never turn a contributor's pull request red.
    continue-on-error: true

    steps:
      - name: Invite the contributor to star the repository
        env:
          CONTRIBUTOR: ${{ github.event.pull_request.user.login }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -uo pipefail

          if [[ "$CONTRIBUTOR" == *"[bot]" ]]; then
            echo "Bot pull request detected; nothing to say."
            exit 0
          fi

          page=1
          found=0

          while true; do
            if ! response="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/${CONTRIBUTOR}/starred?per_page=100&page=${page}")"; then
              echo "Could not read the starred list (rate limited or unavailable); skipping the nudge."
              exit 0
            fi

            count="$(node -e '
              const fs = require("fs");
              const data = JSON.parse(fs.readFileSync(0, "utf8"));
              console.log(Array.isArray(data) ? data.length : 0);
            ' <<<"$response")"

            match="$(node -e '
              const fs = require("fs");
              const [owner, repo] = process.argv.slice(1);
              const data = JSON.parse(fs.readFileSync(0, "utf8"));
              const found = Array.isArray(data) && data.some((item) =>
                item?.owner?.login?.toLowerCase() === owner.toLowerCase() &&
                item?.name?.toLowerCase() === repo.toLowerCase(),
              );
              console.log(found ? "1" : "0");
            ' "$OWNER" "$REPO" <<<"$response")"

            # Default to "no nudge needed" if parsing ever returns nothing, so a
            # malformed payload cannot wedge the loop.
            count="${count:-0}"
            match="${match:-0}"

            if [[ "$match" == "1" ]]; then
              found=1
              break
            fi

            if [[ "$count" -lt 100 ]]; then
              break
            fi

            page=$((page + 1))
          done

          if [[ "$found" == "1" ]]; then
            echo "${CONTRIBUTOR} has starred ${OWNER}/${REPO}. Thank you."
            echo "Thanks for starring ${OWNER}/${REPO}, and thanks for the pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A nudge, never a gate: contributions are welcome whether or not
          # anyone stars the repository.
          echo "::notice title=Enjoying this project?::If it is useful to you, consider starring ${OWNER}/${REPO}. Not required to contribute."
          {
            echo "### Thanks for the pull request"
            echo
            echo "If this project is useful to you, consider giving [${OWNER}/${REPO}](https://github.com/${OWNER}/${REPO}) a star. It helps others find it."
            echo
            echo "This is only a nudge. It never blocks a pull request."
          } >> "$GITHUB_STEP_SUMMARY"
