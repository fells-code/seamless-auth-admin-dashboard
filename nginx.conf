server {
  listen 8080;

  root /usr/share/nginx/html;
  index index.html;

  # Every location below that sets a header of its own must include the shared
  # security headers, because declaring one add_header discards the inherited
  # set. See security-headers.conf.
  location /health {
    access_log off;
    default_type text/plain;
    include /etc/nginx/security-headers.conf;
    return 200 "ok";
  }

  location /assets/ {
    try_files $uri =404;

    # One directive rather than `expires` plus an add_header, which emitted two
    # conflicting Cache-Control values. Asset names are content hashed.
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;

    access_log off;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
    include /etc/nginx/security-headers.conf;
  }

  # The runtime config (API_URL) is regenerated on every container start, so it
  # must never be cached or a redeploy can leave clients pointing at a stale API.
  location = /config.js {
    add_header Cache-Control "no-store";
    include /etc/nginx/security-headers.conf;
  }

  location / {
    try_files $uri /index.html;
  }

  include /etc/nginx/security-headers.conf;

  gzip on;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    text/javascript;
  gzip_min_length 256;

  access_log /dev/stdout;
  error_log /dev/stderr;
}
