server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  location /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  location /assets/ {
    try_files $uri =404;

    expires 1y;
    add_header Cache-Control "public, immutable";

    access_log off;
  }

  location = /index.html {
    add_header Cache-Control "no-store";

    # nginx drops all inherited add_header directives when a location declares
    # its own, so the security headers below must be repeated here to protect
    # the HTML document itself (the response CSP matters for most).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https: http:" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location / {
    try_files $uri /index.html;
  }

  # connect-src is intentionally scheme-broad (https:/http:) because the API
  # origin is configured per deployment at runtime (see entrypoint.sh).
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https: http:" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    text/javascript;
  gzip_min_length 256;

  access_log /dev/stdout;
  error_log /dev/stderr;
}